<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Rent Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>🎓 Student Rent Prediction</h1>

        <p>Enter room details to estimate monthly rent.</p>

        <form method="POST">

            <label>Area (sqft)</label>
            <input type="number" name="area" min="100" max="5000" required>

            <label>Bedrooms</label>
            <input type="number" name="bedrooms" min="1" max="10" required>

            <label>Bathrooms</label>
            <input type="number" name="bathrooms" min="1" max="10" required>

            <label>Distance from College (km)</label>
            <input type="number" step="0.1" name="distance" min="0.1" max="50" required>

            <label>Furnished</label>
            <select name="furnished" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Wi-Fi</label>
            <select name="wifi" required>
                <option value="1">Available</option>
                <option value="0">Not Available</option>
            </select>

            <label>Food Available</label>
            <select name="food" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Mess Available</label>
            <select name="mess" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>AC</label>
            <select name="ac" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Parking</label>
            <select name="parking" required>
                <option value="1">Available</option>
                <option value="0">Not Available</option>
            </select>

            <button type="submit">Predict Monthly Rent</button>

        </form>

        {% if prediction is not none %}
    <div class="result">
        <h2>🎓 Estimated Monthly Rent</h2>
        <p>₹ {{ "{:,.2f}".format(prediction) }}</p>
        <a href="/student-rent" class="try-again">Try Again</a>
    </div>
{% endif %}

        <a href="/">← Back to Home</a>

    </div>

</body>
</html>
